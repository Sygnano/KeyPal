# Releases follow the version in the code. Change it in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json (all three must agree) and push to main: when that version has no release
# yet, this builds the Windows installer (NSIS) and every keyboard's ready-made firmware and attaches
# them to a **draft** release "v<version>" (the firmware to a pre-release "firmware-v<version>",
# see attach-firmware), to check and publish by hand. No tag to push: GitHub
# creates the tag "v<version>" on this commit when the draft is published. Any other push to main
# stops after the first job. (A tag made by a workflow wouldn't start another workflow, which is why
# the release isn't driven by a tag.)
#
# The update is signed with the Tauri updater key (repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and latest.json is attached: installed apps find the release
# once it's published (not a draft). The installer isn't code-signed for Windows (SmartScreen
# warns).
name: Release

on:
  push:
    branches: [main]
  # To retry a failed release: delete its draft (if one was made), then run this on main. The
  # firmware release "firmware-v<version>" can stay: its files are replaced.
  workflow_dispatch:

# One release at a time; a second push while one is building waits rather than racing it.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default: only the jobs that create or fill the release get write access, and the one
# that builds the firmware (third-party code: the QMK CLI and its dependencies, Keychron's tree)
# never holds it.
permissions:
  contents: read

# Keychron's tree at a fixed commit (on branch 2025q3): the one the app's board data and the module's
# builds were checked against. Moving it is a deliberate change, like any dependency: regenerate the
# board data from the new commit in the same change (`board-data` refuses a release otherwise).
env:
  KEYCHRON_BRANCH: 2025q3
  KEYCHRON_COMMIT: c5d998442710b38650903937249144a0cd728ebe

jobs:
  # Is there something to release? The three version fields must agree, and "v<version>" must have
  # no release yet, draft or published (a draft has no tag until it's published, so the releases
  # are what is checked, not the tags). Write access only to see drafts, which a read-only token
  # can't; it runs nothing but checkout and `gh`.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::The three version fields differ: set the same version in all three."
            exit 1
          fi
          tag="v$conf"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | grep -qx "$tag"; then
            echo "$tag already has a release (draft or published): nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet: building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The same checks as CI, so a red commit can't ship. Actions are pinned by commit SHA here (and in
  # the jobs below) because this workflow holds the updater signing key.
  ci:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  # The app's board list (src/data, src/qmk/keycodes.generated.ts) must be what
  # scripts/generate_from_qmk.py makes from KEYCHRON_COMMIT, the tree the firmware below is built
  # from: else the app could offer a board the release has no firmware for, or miss one it has.
  # Fails rather than regenerating, so what ships is what's in git and what CI tested. Read-only;
  # the generator only reads Keychron's files (quantum/, keyboards/keychron: no submodules).
  board-data:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keychron's firmware (fixed commit, quantum/ and keyboards/keychron only)
        run: |
          git init -q "$RUNNER_TEMP/kqmk"
          cd "$RUNNER_TEMP/kqmk"
          git remote add origin https://github.com/Keychron/qmk_firmware.git
          git sparse-checkout init --cone
          git fetch -q --depth 1 --filter=blob:none origin "$KEYCHRON_COMMIT"
          git checkout -q FETCH_HEAD
          git sparse-checkout set quantum keyboards/keychron
      - name: Board data matches Keychron's tree
        run: |
          python3 scripts/generate_from_qmk.py "$RUNNER_TEMP/kqmk"
          # --porcelain also lists new board files, which `git diff` wouldn't.
          changes=$(git status --porcelain -- src/data src/qmk/keycodes.generated.ts)
          if [ -n "$changes" ]; then
            {
              echo "### Board data doesn't match Keychron's tree"
              echo
              echo "The release builds firmware from Keychron \`$KEYCHRON_BRANCH\` at \`$KEYCHRON_COMMIT\`, but the committed board data was generated from another commit. Regenerate it from that commit (\`/regen-boards\`), commit, push:"
              echo
              echo '```sh'
              echo "git -C <Keychron qmk_firmware> checkout $KEYCHRON_COMMIT"
              echo "python3 scripts/generate_from_qmk.py <Keychron qmk_firmware>"
              echo '```'
              echo
              echo '```'
              echo "$changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The board data differs from what Keychron $KEYCHRON_COMMIT generates (see the job summary)."
            exit 1
          fi
          echo "Board data matches Keychron $KEYCHRON_BRANCH at $KEYCHRON_COMMIT."

  windows:
    needs: [version, ci, board-data]
    runs-on: windows-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Updater artifacts (the signed installer + latest.json) only for releases.
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          tagName: ${{ needs.version.outputs.tag }}
          # The tag is made on publishing, on the commit that was built (not wherever main is then).
          releaseCommitish: ${{ github.sha }}
          releaseName: "KBoard Companion ${{ needs.version.outputs.tag }}"
          releaseBody: "Windows installer. See README.md for what's needed (the firmware module). Tried on hardware: the V6 8K ISO."
          releaseDraft: true
          # Not a pre-release: GitHub's "latest release" (what the app checks) skips those.
          prerelease: false

  # The ready-made firmware the app flashes without QMK MSYS (firmware/quick.rs): every keyboard
  # the app knows, Keychron's own keymap + this release's module, and firmware.json listing them.
  # About 270 builds: an hour or two. Read-only: the files go to the release from the next job, so
  # nothing this job runs could replace a release's firmware (and the hashes the app checks).
  firmware:
    needs: [version, windows]
    # 24.04 has Python 3.12, which scripts/release-requirements.txt is resolved for.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    # Keychron's tree at KEYCHRON_COMMIT (the workflow's env), the one `board-data` checked.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (ARM GCC, QMK CLI pinned with hashes)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          python3 -m venv "$RUNNER_TEMP/qmk-venv"
          "$RUNNER_TEMP/qmk-venv/bin/pip" install --require-hashes --only-binary :all: -r scripts/release-requirements.txt
          echo "$RUNNER_TEMP/qmk-venv/bin" >> "$GITHUB_PATH"
      - name: Keychron's firmware (fixed commit, sparse)
        run: |
          git init -q "$RUNNER_TEMP/kqmk"
          cd "$RUNNER_TEMP/kqmk"
          git remote add origin https://github.com/Keychron/qmk_firmware.git
          git sparse-checkout init --cone
          git fetch -q --depth 1 --filter=blob:none origin "$KEYCHRON_COMMIT"
          # A branch named like Keychron's, so firmware.json says "2025q3 at <commit>".
          git checkout -q -B "$KEYCHRON_BRANCH" FETCH_HEAD
          git sparse-checkout set $(git ls-tree -d --name-only HEAD | grep -vE '^(keyboards|tests|\.github|\.vscode)$' | tr '\n' ' ') keyboards/keychron
          git submodule update --init --depth 1 --recommend-shallow lib/chibios lib/chibios-contrib lib/lufa lib/printf
          echo "QMK_DIR=$RUNNER_TEMP/kqmk" >> "$GITHUB_ENV"
      # firmware.json's `tag` is the release's: the app builds its download URLs from it.
      - name: Build every keyboard's firmware
        run: python3 scripts/build_prebuilt.py "$RUNNER_TEMP/prebuilt" "${{ needs.version.outputs.tag }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-firmware
          path: ${{ runner.temp }}/prebuilt

  # Puts the `.bin` files on a pre-release of their own, "firmware-v<version>", and firmware.json on
  # the app's draft: ~270 files would bury the installer on the app's release page. The firmware
  # release is published at once (the app can't download a draft's files; a pre-release is never
  # "latest", so the updater and `/latest/` skip it) and the app finds it from firmware.json's tag
  # (`firmware_release` in firmware/quick.rs). Write access, but it runs nothing but GitHub's own
  # artifact download and the `gh` CLI.
  attach-firmware:
    needs: [version, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilt-firmware
          path: prebuilt
      - name: Publish the firmware release, attach firmware.json to the app's
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          fw="firmware-$TAG"
          # A retry (draft deleted, workflow run again) finds it already made: replace its files.
          if ! gh release view "$fw" > /dev/null 2>&1; then
            gh release create "$fw" --prerelease --target "${{ github.sha }}" --title "Firmware for KBoard Companion $TAG" \
              --notes "The ready-made firmware KBoard Companion $TAG installs (Firmware → Basic mode): Keychron's own keymap with the profile switcher, one file per keyboard. The app downloads the right one by itself; nothing to get here by hand."
          fi
          gh release upload "$fw" prebuilt/*.bin prebuilt/firmware.json --clobber
          gh release upload "$TAG" prebuilt/firmware.json --clobber
